name: intraday

# 每个交易日北京时间 14:00 / 14:15 / 14:45 各记录一次当日快照（上证与沪深300 点位/分时、
# 指数基金估值广度、覆盖基金估值），写入 state/intraday.json 并自动触发 daily 重建看板，
# 保证 15:00 收盘前至少有一次可用于判断的盘中数据。只读公开行情接口，单次约 1-2 分钟。

on:
  schedule:
    - cron: "0 6 * * 1-5"    # 北京 14:00
    - cron: "15 6 * * 1-5"   # 北京 14:15
    - cron: "45 6 * * 1-5"   # 北京 14:45
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Take snapshot
        run: python intraday.py

      - name: Persist snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/intraday.json
          if git diff --cached --quiet; then
            echo "快照无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(intraday): 记录 $(TZ=Asia/Shanghai date +%F' '%H:%M) 快照"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger dashboard build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          bj = timezone(timedelta(hours=8))
          today = datetime.now(bj).strftime("%Y-%m-%d")
          with open("state/intraday.json", encoding="utf-8") as f:
              snap = json.load(f)
          trend_day = (snap.get("index") or {}).get("trendDate")
          if trend_day != today:
              print(f"分时日期 {trend_day} 非今日 {today}，疑似休市，跳过构建")
              raise SystemExit(0)

          url = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] \
              + "/actions/workflows/daily.yml/dispatches"
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "main"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("daily 已触发：", resp.status)
          PY
