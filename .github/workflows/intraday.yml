name: intraday

# 因 GitHub 定时任务在该账号上实测每天只有 2–3 次机会且延迟可达数小时：
# 参考同账号 oil-monitor 的做法，用“低频 cron + 宽时间窗守卫”。
# cron 每小时一次（每小时 23 分，避开整点拥堵），实际可能只在任意 2–3 个小时被调度到；
# 每次运行先校验北京时间，只有落在 13:25–15:05 才真正抓快照，其余 5 秒内退出。
# 快照写入 state/intraday.json；13:30–14:30 之间第一次运行派发推送（PushPlus），
# 且只在推送成功后回写 notifiedDate；15:00 后的快照留给 18:00 的 daily 补发。

on:
  schedule:
    - cron: "23 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Window guard
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，跳过时间窗校验"
            echo "go=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bj=$(TZ=Asia/Shanghai date +%H%M)
          n=$((10#$bj))
          if [ "$n" -ge 1325 ] && [ "$n" -le 1505 ]; then
            echo "北京时间 $bj，在窗口内"
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "北京时间 $bj，不在 13:25–15:05 窗口，跳过"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.go == '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Take snapshot
        if: steps.gate.outputs.go == '1'
        run: python intraday.py

      - name: Persist snapshot
        id: commit
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/intraday.json
          if git diff --cached --quiet; then
            echo "快照无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(intraday): 记录 $(TZ=Asia/Shanghai date +%F' '%H:%M) 快照"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger dashboard build
        if: steps.gate.outputs.go == '1' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          bj = timezone(timedelta(hours=8))
          today = datetime.now(bj).strftime("%Y-%m-%d")
          with open("state/intraday.json", encoding="utf-8") as f:
              snap = json.load(f)
          trend_day = (snap.get("index") or {}).get("trendDate")
          if trend_day != today:
              print(f"分时日期 {trend_day} 非今日 {today}，疑似休市，跳过构建")
              raise SystemExit(0)

          hm = snap.get("time") or ""
          notify = "1" if snap.get("notifyRun") else "0"
          mm = int(hm[3:5]) if len(hm) == 5 else -1
          hh = hm[:2]
          build = (notify == "1"
                   or (hh == "13" and 30 <= mm < 40)
                   or (hh == "14" and (mm < 10 or 15 <= mm < 25 or 30 <= mm < 40)))
          if not build:
              print(f"快照 {hm} 不是构建时点，只记录不重建")
              raise SystemExit(0)

          url = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] \
              + "/actions/workflows/daily.yml/dispatches"
          payload = {"ref": "main", "inputs": {"notify": notify}}
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req, timeout=20) as resp:
              print(f"daily 已触发（notify={notify}，快照 {hm}）：", resp.status)
          PY
