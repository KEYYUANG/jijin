name: daily

# 每个交易日（北京时间 18:00）跑一次全量筛选，并把看板发布到 GitHub Pages。
# 前提：
#   1. 仓库 Settings → Pages → Source 选择 "GitHub Actions"
#   2. 私有仓库的 Pages 需要 Pro/Team 计划，否则请把仓库设为公开
#   3. 首次运行没有缓存，约 45-60 分钟；之后命中缓存约 5-15 分钟

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      notify:
        description: "构建完成后推送 PushPlus（1=推送）"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: nav-${{ github.run_id }}
          restore-keys: nav-

      - name: Close snapshot (15:00 correction)
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          # 18:00 定时构建时，用收盘价对当日预测做一次修正（槽位记为 15:00 收盘）
          python intraday.py --close || echo "收盘修正失败，沿用盘中快照"

      - name: Run screening
        run: python fund_mvp.py --limit 0 --total-value 100000

      - name: Build dashboard
        run: python make_dashboard.py

      - name: PushPlus notification
        if: github.event.inputs.notify == '1'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python notify_pushplus.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- state; then
            echo "state 无变化"
          else
            git add state
            git commit -m "chore(state): 更新 $(date -u +%F) 运行结果"
            git pull --rebase --autostash
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p site
          cp output/tier_dashboard.html site/index.html
          cp output/tiers.csv site/
          cp output/summary.txt site/
          printf '' > site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 兜底：14:30 那轮若因 GitHub 定时延迟未推送，18:00 这轮补发一条（当日已推过则跳过）
      - name: Catch-up notification
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python notify_pushplus.py --catch-up

      # 每月 1 日发一条心跳，连续缺席即说明定时或推送链路已静默失效
      - name: Monthly heartbeat
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ "$(TZ=Asia/Shanghai date +%d)" = "01" ]; then
            python notify_pushplus.py --heartbeat
          else
            echo "非月初，跳过心跳"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
